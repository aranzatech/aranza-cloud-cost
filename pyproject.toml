[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aranza-cloud-costs"
version = "0.1.1"
description = "Multi-cloud cost and budget monitoring with Slack and Telegram alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AranzaTech" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "boto3>=1.34",
  "azure-identity>=1.17",
  "google-cloud-bigquery>=3.25",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
aranza-cloud-costs = "aranza_cloud_costs.cli:main"

[project.urls]
Homepage = "https://github.com/aranzatech/aranza-cloud-cost"

[tool.hatch.build.targets.wheel]
packages = ["src/aranza_cloud_costs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
